name: Build ILSpy Mobile APK
# CI run requested after synchronizing the Termux builder image with infra-improvs.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ilspy-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: NativeAOT + Android APK (ARM64 / x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          export LC_ALL=C
          mkdir -p "$RUNNER_TEMP/ilspy-mobile"
          for chunk in "$GITHUB_WORKSPACE"/source-bundle/part-*.b64; do
            test -f "$chunk"
            sha256sum "$chunk" >&2
            cat "$chunk"
          done | base64 --decode > "$RUNNER_TEMP/ILSpyMobile-source.zip"
          echo "Reconstructed source archive:"
          wc -c "$RUNNER_TEMP/ILSpyMobile-source.zip"
          sha256sum "$RUNNER_TEMP/ILSpyMobile-source.zip"
          unzip -tq "$RUNNER_TEMP/ILSpyMobile-source.zip"
          unzip -q "$RUNNER_TEMP/ILSpyMobile-source.zip" -d "$RUNNER_TEMP/ilspy-mobile"
          test -f "$RUNNER_TEMP/ilspy-mobile/app/build.gradle"
          test -f "$RUNNER_TEMP/ilspy-mobile/native/ILSpyEngine/Exports.cs"

      - name: Patch native loading and diagnostics
        run: python "$GITHUB_WORKSPACE/scripts/patch-native-loading.py" "$RUNNER_TEMP/ilspy-mobile"

      - name: Add ELF, DEX and ARSC binary workbench
        run: python "$GITHUB_WORKSPACE/scripts/patch-binary-tools.py" "$RUNNER_TEMP/ilspy-mobile"

      - name: Add integrated Termux startup, terminal and foreground service
        run: python "$GITHUB_WORKSPACE/scripts/patch-termux-environment.py" "$RUNNER_TEMP/ilspy-mobile"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          test -d "$SDK_ROOT/cmdline-tools"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK, NDK and CMake packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Configure Android NDK environment
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          NDK_ROOT="$SDK_ROOT/ndk/28.2.13676358"
          test -d "$NDK_ROOT"
          echo "ANDROID_NDK_HOME=$NDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_ROOT" >> "$GITHUB_ENV"
          echo "$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Build custom Termux bootstrap for ILSpy Mobile
        shell: bash
        run: |
          set -euo pipefail
          TERMUX_DIR="$RUNNER_TEMP/termux-packages"
          CONTAINER_NAME="ilspy-termux-bootstrap"
          BUILDER_IMAGE="ghcr.io/termux/package-builder:latest"

          git clone --depth 1 --branch infra-improvs https://github.com/agnostic-apollo/termux-packages.git "$TERMUX_DIR"
          cd "$TERMUX_DIR"

          # DocBook moved its historical XML DTD archives to archive.docbook.org.
          # The old docbook.org URLs return HTTP 404; keep the upstream SHA-256
          # pins intact and change only the download host.
          DOCBOOK_BUILD="$TERMUX_DIR/packages/docbook-xml/build.sh"
          test -f "$DOCBOOK_BUILD"
          sed -i 's#https://docbook.org/xml/#https://archive.docbook.org/xml/#g' "$DOCBOOK_BUILD"
          test "$(grep -c 'https://archive.docbook.org/xml/' "$DOCBOOK_BUILD")" -eq 5
          if grep -Fq 'https://docbook.org/xml/' "$DOCBOOK_BUILD"; then
            echo "DocBook legacy download URL remains in build.sh" >&2
            exit 1
          fi
          grep 'termux_download "https://archive.docbook.org/xml/' "$DOCBOOK_BUILD"

          # invisible-island.net returned HTTP 403 in the previous CI run.
          # Use the maintainer's official mirror for the pinned Dialog source.
          # Keep the upstream SHA-256 and verify the mirror before starting the
          # long bootstrap build, so an unavailable/corrupt mirror fails early.
          DIALOG_BUILD="$TERMUX_DIR/packages/dialog/build.sh"
          test -f "$DIALOG_BUILD"
          DIALOG_URL="https://invisible-mirror.net/archives/dialog/dialog-1.3-20240307.tgz"
          DIALOG_SHA256="339d311c6abb240213426b99ad63565cbcb3e8641ef1989c033e945b754d34ef"
          DIALOG_PREFLIGHT="$RUNNER_TEMP/dialog-1.3-20240307.tgz"
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors --connect-timeout 20 --max-time 120 "$DIALOG_URL" --output "$DIALOG_PREFLIGHT"
          echo "$DIALOG_SHA256  $DIALOG_PREFLIGHT" | sha256sum --check --status
          sed -i "s#^TERMUX_PKG_SRCURL=.*#TERMUX_PKG_SRCURL=$DIALOG_URL#" "$DIALOG_BUILD"
          grep -F "TERMUX_PKG_SRCURL=$DIALOG_URL" "$DIALOG_BUILD"
          grep -F "TERMUX_PKG_SHA256=$DIALOG_SHA256" "$DIALOG_BUILD"

          # Set the application id before generating bootstrap metadata.
          sed -i -E 's/^TERMUX_APP__PACKAGE_NAME=.*/TERMUX_APP__PACKAGE_NAME="com.ilspy.mobile"/' scripts/properties.sh
          grep -n '^TERMUX_APP__PACKAGE_NAME' scripts/properties.sh

          # Codeberg regenerated the foot 1.23.1 source archive. The pinned
          # Termux recipe checksum is stale; pin the exact SHA-256 observed
          # from the successful HTTPS download in CI (do not disable checking).
          FOOT_BUILD="$TERMUX_DIR/x11-packages/foot/build.sh"
          test -f "$FOOT_BUILD"
          sed -i 's/^TERMUX_PKG_SHA256=02072b8f0aaf26907b6b02293c875539ce52fc59079344e7cf811ab03394cfa3$/TERMUX_PKG_SHA256=b3fa774983abb5f95aecca4557d146091d8666bc65fb310d4d3e38327357ade9/' "$FOOT_BUILD"
          grep '^TERMUX_PKG_SHA256=' "$FOOT_BUILD"

          # Backport the official Unbound fix for SWIG 4.4's removal of
          # the deprecated $function macro. The upstream commit replaces it
          # with $action in libunbound/python/libunbound.i.
          UNBOUND_BUILD="$TERMUX_DIR/packages/libunbound/build.sh"
          test -f "$UNBOUND_BUILD"
          cat >> "$UNBOUND_BUILD" <<'TERMUX_UNBOUND_FIX'
          termux_step_pre_configure() {
              local interface_file="$TERMUX_PKG_SRCDIR/libunbound/python/libunbound.i"
              test -f "$interface_file"
              sed -i 's/\$function/\$action/g' "$interface_file"
              if grep -Fq '$function' "$interface_file"; then
                  echo "Unbound SWIG compatibility patch did not apply" >&2
                  return 1
              fi
          }
          TERMUX_UNBOUND_FIX
          tail -n 12 "$UNBOUND_BUILD"

          # Backport the upstream command-not-found fix without replacing the
          # recipe's existing Node.js setup. termux_setup_nodejs() is essential:
          # generate-db.js has a /usr/bin/env node shebang.
          CNF_BUILD="$TERMUX_DIR/packages/command-not-found/build.sh"
          NODE_SETUP="$TERMUX_DIR/scripts/build/setup/termux_setup_nodejs.sh"
          PATCH_TOOL="$TERMUX_DIR/scripts/patch-command-not-found.py"
          test -f "$CNF_BUILD"
          test -f "$NODE_SETUP"
          grep -F 'NODEJS_VERSION=22.17.0' "$NODE_SETUP"
          grep -F '325c0f1261e0c61bcae369a1274028e9cfb7ab7949c05512c5b1e630f7e80e12' "$NODE_SETUP"
          cat > "$PATCH_TOOL" <<'PATCH_TOOL_PY'
          import pathlib
          import re
          import sys

          if len(sys.argv) != 2:
              raise SystemExit("usage: patch-command-not-found.py generate-db.js")

          source = pathlib.Path(sys.argv[1])
          if not source.is_file():
              raise SystemExit(f"command-not-found source missing: {source}")
          content = source.read_text()
          pattern = re.compile(
              r"if \(packageName === undefined\) \{\n\s+console\.error\(.*?\);\n\s+process\.exit\(1\);\n\s+\}",
              re.S,
          )
          matches = list(pattern.finditer(content))
          if len(matches) != 1:
              raise SystemExit("Unexpected command-not-found source; refusing an unverified patch")
          match = matches[0]
          old_block = match.group(0)
          new_block = old_block.replace("console.error(", "console.warn(").replace("process.exit(1);", "return;")
          if new_block == old_block or "console.error(" in new_block or "process.exit(1)" in new_block:
              raise SystemExit("command-not-found alternatives patch did not change the fatal branch")
          patched = content[:match.start()] + new_block + content[match.end():]
          source.write_text(patched)
          print("Applied verified command-not-found alternatives compatibility patch")
          PATCH_TOOL_PY
          python3 -m py_compile "$PATCH_TOOL"
          python3 - "$CNF_BUILD" <<'PATCH_RECIPE_PY'
          import pathlib
          import sys

          build_file = pathlib.Path(sys.argv[1])
          content = build_file.read_text()
          old = "termux_step_pre_configure() {\n\texport TERMUX_PREFIX\n\texport TERMUX_SCRIPTDIR\n\ttermux_setup_nodejs\n}"
          new = """termux_step_pre_configure() {
          \texport TERMUX_PREFIX
          \texport TERMUX_SCRIPTDIR
          \ttermux_setup_nodejs
          \tlocal source_file=\"$TERMUX_PKG_SRCDIR/generate-db.js\"
          \ttest -f \"$source_file\"
          \tpython3 \"$TERMUX_SCRIPTDIR/patch-command-not-found.py\" \"$source_file\"
          \tnode --check \"$source_file\"
          }"""
          if content.count(old) != 1:
              raise SystemExit("Unexpected command-not-found pre-configure hook; refusing to replace it")
          patched = content.replace(old, new)
          if patched.count("termux_step_pre_configure() {") != 1:
              raise SystemExit("command-not-found pre-configure hook was duplicated")
          if "termux_setup_nodejs" not in patched:
              raise SystemExit("Original Node.js setup was not preserved")
          build_file.write_text(patched)
          print("Patched command-not-found while preserving termux_setup_nodejs()")
          PATCH_RECIPE_PY
          grep -A8 '^termux_step_pre_configure()' "$CNF_BUILD"
          test "$(grep -c '^termux_step_pre_configure()' "$CNF_BUILD")" -eq 1

          # Build the builder image from the SAME pinned Termux branch.
          # The published :latest image currently contains NDK r30, while
          # infra-improvs pins NDK r28c and its matching checksum.
          # Building from this checkout keeps the Docker image and source in sync.
          docker build --pull -t "$BUILDER_IMAGE" -f "$TERMUX_DIR/scripts/Dockerfile" "$TERMUX_DIR/scripts"
          docker run --rm --init --name "$CONTAINER_NAME" \
            --volume "$TERMUX_DIR:/home/builder/termux-packages" \
            --security-opt "seccomp=$TERMUX_DIR/scripts/profile.json" \
            --env CI=true \
            --workdir /home/builder/termux-packages \
            "$BUILDER_IMAGE" \
            bash -lc '
              set -euo pipefail
              echo "Builder identity: $(id)"
              echo "Builder home: $HOME"
              echo "Builder workdir: $PWD"

              NDK="$HOME/lib/android-ndk-r28c"
              if [ ! -d "$NDK" ]; then
                echo "ERROR: Termux builder image does not contain expected NDK: $NDK" >&2
                find "$HOME/lib" -maxdepth 2 -type f -name source.properties -print 2>/dev/null || true
                exit 20
              fi
              if ! grep -q "Pkg.Revision = 28.2.13676358" "$NDK/source.properties"; then
                echo "ERROR: Wrong NDK revision in $NDK/source.properties" >&2
                cat "$NDK/source.properties" >&2
                exit 21
              fi
              export NDK
              echo "Verified Termux builder NDK:"
              grep "Pkg.Revision" "$NDK/source.properties"
              test -x "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"

              # Preflight command-not-found for both ABIs before the full bootstrap
              # so missing host tools fail immediately instead of after long builds.
              for arch in aarch64 x86_64; do
                echo "Preflight: command-not-found for $arch"
                ./build-package.sh -a "$arch" command-not-found
              done

              ./scripts/build-bootstraps.sh \
                --architectures aarch64,x86_64 \
                --no-build-unneeded-subpackages \
                --packages-post-additional clang,cmake,ninja,git,python,make,pkg-config,binutils
            '

          mkdir -p "$RUNNER_TEMP/ilspy-mobile/app/src/main/assets/termux"
          for arch in aarch64 x86_64; do
            archive="$TERMUX_DIR/bootstrap-$arch.zip"
            test -s "$archive"
            unzip -tq "$archive"
            cp "$archive" "$RUNNER_TEMP/ilspy-mobile/app/src/main/assets/termux/bootstrap-$arch.zip"
            echo "Bundled custom-prefix Termux bootstrap: $arch ($(wc -c < "$archive") bytes)"
          done

      - name: Install NativeAOT host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev unzip

      - name: Publish ILSpy engine (ARM64 and x86_64)
        working-directory: ${{ runner.temp }}/ilspy-mobile
        run: ./scripts/build-engine.sh
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          DOTNET_NOLOGO: '1'

      - name: Verify NativeAOT decompiler and Roslyn exports
        shell: bash
        run: |
          set -euo pipefail
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          NM="$NDK_BIN/llvm-nm"
          for abi in arm64-v8a x86_64; do
            library="$RUNNER_TEMP/ilspy-mobile/app/src/main/assets/native/$abi/libilspy_engine.so"
            test -s "$library"
            symbols_file="$RUNNER_TEMP/native-exports-$abi.txt"
            "$NM" -D --defined-only "$library" | tee "$symbols_file"
            for symbol in ilspy_engine_version ilspy_inspect_file ilspy_decompile_file ilspy_decompile_type ilspy_engine_free_string ilspy_recompile_csharp ilspy_recompiler_free_string; do
              if ! grep -Fq "$symbol" "$symbols_file"; then
                echo "::error::NativeAOT export missing for $abi: $symbol"
                exit 1
              fi
            done
            echo "Verified all ILSpy + Roslyn exports for $abi"
          done

      - name: Build Rizin + Ghidra native .so decompiler (ARM64 / x86_64)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build meson pkg-config zlib1g-dev
          bash "$GITHUB_WORKSPACE/scripts/build-native-decompiler.sh" "$RUNNER_TEMP/ilspy-mobile"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run Android checks and build APKs
        working-directory: ${{ runner.temp }}/ilspy-mobile
        run: gradle --no-daemon clean lintDebug testDebugUnitTest assembleDebug assembleRelease

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ILSpy-Mobile-Android-APKs
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/ilspy-mobile/app/build/outputs/apk/debug/app-debug.apk
            ${{ runner.temp }}/ilspy-mobile/app/build/outputs/apk/release/app-release-unsigned.apk
